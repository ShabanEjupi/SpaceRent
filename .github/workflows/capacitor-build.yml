name: Build Mobile Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Build Web App
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate Assets
        run: |
          mkdir -p assets
          curl -sL https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png -o assets/icon.png
          curl -sL https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/splash.png -o assets/splash.png
          npx --yes @capacitor/assets generate --android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Build Web App
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Generate Assets
        run: |
          mkdir -p assets
          curl -sL https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png -o assets/icon.png
          curl -sL https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/splash.png -o assets/splash.png
          npx --yes @capacitor/assets generate
      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/build/Release-iphoneos/App.app
